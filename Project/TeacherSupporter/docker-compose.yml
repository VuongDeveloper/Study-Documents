services:
  # ===== INFRASTRUCTURE =====
  postgres-auth:
    image: postgres:17
    environment:
      POSTGRES_DB: ts_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  postgres-course:
    image: postgres:17
    environment:
      POSTGRES_DB: ts_course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - postgres-course-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
      - "1025:1025"

  # ===== OBJECT STORAGE: Alarik (replaces MinIO, see docs/MIGRATION-ALARIK.md) =====
  # S3-compatible store written in Swift (Apache 2.0). Pinned to a beta tag on
  # purpose: the project is pre-1.0 and `latest` moves between incompatible
  # betas. Host port 9000 is kept so nothing else in the stack changes.
  alarik:
    image: ghcr.io/achtungsoftware/alarik:1.0.0-beta-16
    ports:
      - "9000:8080"   # S3 API + internal admin API (/api/v1/*)
    environment:
      # URL the API prints in responses; must be the address clients use.
      API_BASE_URL: http://localhost:9000
      CONSOLE_BASE_URL: http://localhost:9001
      # Console login (web UI on :9001). Not the S3 credentials.
      ADMIN_USERNAME: ${ALARIK_ADMIN_USERNAME:-alarik}
      ADMIN_PASSWORD: ${ALARIK_ADMIN_PASSWORD:-alarikadmin}
      # Signs console session tokens. Override in anything public.
      JWT: ${ALARIK_JWT:-change-me-alarik-console-jwt-secret}
      # SigV4 credential scope: clients MUST sign for this exact region
      # (a mismatch is rejected with HTTP 400). Matches app.s3.region.
      ALARIK_REGION: us-east-1
      # S3 access key provisioned for the admin account on first start --
      # this is what course-service authenticates with (APP_S3_ACCESS_KEY).
      DEFAULT_ACCESS_KEY: ${ALARIK_ACCESS_KEY:-tsaccesskey}
      DEFAULT_SECRET_KEY: ${ALARIK_SECRET_KEY:-tssecretkey123}
      # Created at startup, so course-service's headBucket succeeds on the
      # first boot (its createBucket fallback still works if this is removed).
      DEFAULT_BUCKETS: ts-submissions
      ALLOW_ACCOUNT_CREATION: "false"
      ALARIK_FSYNC: "true"
    volumes:
      - alarik-data:/app/Storage
    healthcheck:
      # Unauthenticated liveness endpoint of the internal API; verified 200.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      retries: 5

  # Web console (buckets, keys, users). Optional -- the app never talks to it.
  # Reaches the API from the BROWSER, hence localhost:9000, not alarik:8080.
  alarik-console:
    image: ghcr.io/achtungsoftware/alarik-console:1.0.0-beta-16
    ports:
      - "9001:3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:9000
      NUXT_PUBLIC_CONSOLE_BASE_URL: http://localhost:9001
      NUXT_PUBLIC_ALLOW_ACCOUNT_CREATION: "false"
    depends_on:
      alarik:
        condition: service_healthy

  # ===== SPRING CLOUD =====
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
      - "5888:5888"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
      - "5761:5761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5761"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "5080:5080"
    depends_on:
      - discovery-server
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5080"

  # ===== APPLICATION SERVICES =====
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
      - "5081:5081"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/ts_auth
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5081"

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
      - "5082:5082"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-course:
        condition: service_healthy
      kafka:
        condition: service_started
      alarik:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-course:5432/ts_course
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Alarik listens on 8080 inside the container; 9000 is the host mapping.
      APP_S3_ENDPOINT: http://alarik:8080
      # Presigned URLs are opened by the browser, so they are signed for the
      # host-visible address. SigV4 binds the signature to the Host header.
      APP_S3_PUBLIC_ENDPOINT: http://localhost:9000
      APP_S3_ACCESS_KEY: ${ALARIK_ACCESS_KEY:-tsaccesskey}
      APP_S3_SECRET_KEY: ${ALARIK_SECRET_KEY:-tssecretkey123}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5082"

  dictionary-service:
    build:
      context: ./dictionary-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
      - "5083:5083"
    depends_on:
      config-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/ts_dictionary
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5083"

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
      - "5084:5084"
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_MAIL_HOST: maildev
      SPRING_MAIL_PORT: 1025
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5084"

volumes:
  postgres-auth-data:
  postgres-course-data:
  mongo-data:
  alarik-data:
