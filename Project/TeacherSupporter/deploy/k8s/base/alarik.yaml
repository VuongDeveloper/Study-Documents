# Alarik -- S3-compatible object storage (replaced MinIO; docs/MIGRATION-ALARIK.md).
#
# Still a hard startup dependency for course-service: S3StorageService's
# @PostConstruct calls headBucket and only catches NoSuchBucketException, so an
# unreachable store fails bean creation. Kubernetes has no depends_on --
# course-service will CrashLoopBackOff until this pod is Ready, then recover.
#
# Image is pinned to a beta tag. Alarik is pre-1.0 and `latest` moves between
# betas that may change on-disk layout; an upgrade is a deliberate edit here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarik
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO volume: never two pods holding it at once
  selector:
    matchLabels: { app: alarik }
  template:
    metadata:
      labels: { app: alarik }
    spec:
      containers:
        - name: alarik
          image: ghcr.io/achtungsoftware/alarik:1.0.0-beta-16
          ports:
            - { name: s3, containerPort: 8080 }
          env:
            # Address the API prints in responses. In-cluster callers use the
            # Service name; the browser never sees this value (presigned URLs
            # are signed by course-service for APP_S3_PUBLIC_ENDPOINT).
            - { name: API_BASE_URL, value: "http://alarik:8080" }
            - { name: CONSOLE_BASE_URL, value: "http://localhost:3000" }
            # SigV4 credential scope; course-service signs for the same
            # region (APP_S3_REGION default us-east-1). Mismatch = HTTP 400.
            - { name: ALARIK_REGION, value: "us-east-1" }
            # A bucket listed here exists before course-service's first
            # headBucket; the createBucket fallback in code still applies.
            - { name: DEFAULT_BUCKETS, value: "ts-submissions" }
            - { name: ALLOW_ACCOUNT_CREATION, value: "false" }
            - { name: ALARIK_FSYNC, value: "true" }
          envFrom:
            # ADMIN_USERNAME / ADMIN_PASSWORD (console login), JWT (console
            # session signing), DEFAULT_ACCESS_KEY / DEFAULT_SECRET_KEY (the
            # S3 key course-service uses) -- created by ../create-secrets.sh.
            - secretRef: { name: alarik }
          volumeMounts:
            - { name: data, mountPath: /app/Storage }
          # Unauthenticated liveness endpoint of the internal API (verified
          # to answer 200 on 1.0.0-beta-16). The S3 root "/" answers 403.
          readinessProbe:
            httpGet: { path: /api/v1/health, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: s3 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: alarik-data }
---
# New claim on purpose: Alarik's on-disk layout under /app/Storage is not
# MinIO's, so reusing minio-data would mix two formats in one volume. Copy
# objects across with `rclone sync` (docs/MIGRATION-ALARIK.md), then delete
# the old claim by hand once the copy is verified.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alarik-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alarik
spec:
  selector: { app: alarik }
  ports:
    - { name: s3, port: 8080, targetPort: 8080 }
---
# Presigned download URLs are opened by the BROWSER, so the store must be
# reachable on the public host -- something the MinIO deployment never had
# (APP_S3_PUBLIC_ENDPOINT was unset in the cluster, so every download link
# was signed for localhost:9000 and dead).
#
# Why the path is the bucket name and nothing is stripped: with path-style
# addressing a presigned URL is  http://<host>/<bucket>/<key>?X-Amz-...  and
# the SigV4 signature covers both the Host header and the canonical URI. A
# prefix like /s3 with StripPrefix would change the URI the store sees and
# break every signature. Routing PathPrefix(/ts-submissions) straight through
# keeps host and path exactly as signed. Traefik picks the longest matching
# prefix per host, so this wins over the frontend's "/" catch-all and never
# collides with the gateway's /api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alarik
spec:
  rules:
    - host: ts.local
      http:
        paths:
          - path: /ts-submissions
            pathType: Prefix
            backend:
              service:
                name: alarik
                port: { number: 8080 }
    - host: ts-server.tailbfe002.ts.net
      http:
        paths:
          - path: /ts-submissions
            pathType: Prefix
            backend:
              service:
                name: alarik
                port: { number: 8080 }
