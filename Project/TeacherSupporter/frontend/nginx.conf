# nginx server block for the React frontend inside the cluster.
#
# Division of labour on ts.local (Traefik decides by longest path prefix):
#   /api, /oauth2, /login/oauth2  -> api-gateway   (never reach this nginx)
#   everything else               -> here          (static files + SPA fallback)
# So this file does NOT proxy anything: in production the frontend's
# "/api" calls are same-origin and Traefik, not nginx, routes them. The
# Vite dev-server proxy in vite.config.ts plays that role only on a laptop.
server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback. React Router (BrowserRouter) owns URLs like /courses/42
    # purely in the browser -- no such file exists on disk. On a deep link or
    # a page refresh nginx must answer index.html and let the router take
    # over, otherwise the user gets a 404 for any URL except "/".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes everything under /assets (index-CqZING8N.js), so a
    # changed file always has a new name: cache these forever. index.html is
    # deliberately NOT covered -- it must be re-fetched so it can point at
    # the new hashes after a deploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Kubernetes probes hit this; keeps "is nginx up" separate from "/",
    # which would also succeed but pollutes access logs less this way.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
