<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <h2>Your TeacherSupporter account is ready</h2>
    <p>An administrator has created an account for you as a <strong th:text="${role}">ROLE</strong>.</p>
    <p>Sign in with these credentials:</p>
    <ul>
        <li>Username: <strong th:text="${email}">email</strong></li>
        <li>Temporary password: <strong th:text="${tempPassword}">password</strong></li>
    </ul>
    <p>You will be required to change this password on your first login.</p>
    <p><a th:href="${loginLink}">Go to login</a></p>
</body>
</html>
